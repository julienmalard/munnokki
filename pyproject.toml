[project]
name = "munnokki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "appdata>=2.2.1",
    "cartopy>=0.26.0",
    "caseutil>=0.7.2",
    "cdsapi>=0.7.7",
    "dask>=2026.8.0",
    "flox>=0.11.2",
    "gdal>=3.13.3",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "owslib>=0.36.0",
    "patool>=4.1.0",
    "pybtex>=0.26.1",
    "pybtexris>=0.2.0",
    "rarfile>=4.5",
    "requests>=2.34.2",
    "rioxarray>=0.23.0",
    "scipy>=1.18.1",
    "soilgrids>=0.1.5",
    "urllib3>=2.7.0",
    "xarray>=2026.7.0",
    "xarray-regrid>=0.4.2",
]

[tool.pytest.ini_options]
python_files = "*_சோதிக்க.py"
python_classes = "சோதனை"
python_functions = "*_சோதிக்க"
pythonpath = [
    "src"
]

[tool.coverage.run]
source = ["src"]


[tool.uv]
required-environments = [
    "python_version >= '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scipy-stubs~=1.18.1",
    "coverage>=7.16.1",
    "twine>=7.0.0",
    "requests-mock>=1.12.1",
]
