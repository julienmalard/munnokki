name: முன்னோக்கியின் சோதனைகள்

concurrency:
  group: சோதனைகள்-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

on:
  push:
    branches:
      - முதன்மை_
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - முதன்மை_
    paths-ignore:
        - '**.md'

jobs:
  sodhanai:
    name: சோதனைகள்
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: trundev/setup-gdal@main
        with:
          use-conda: true
      - name: UV நிறுவல்
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: சோதிக்க
        run: uv run coverage run -m pytest && uv run coverage xml

      - name: கோட்கவுக்கு அறிவிக்கை அனுப்பு
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
